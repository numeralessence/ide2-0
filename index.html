<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a32963">
  <title>IDE 2.0 — Campus de révisions IFSI</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff8f3}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#fff8f3}
  </style>
</head>
<body>
  <iframe id="appFrame" src="./Index.html?v=20261125-5" title="IDE 2.0 — Révisions IFSI"></iframe>
  <script>
    const BASE_MODULES=[
      "data-anatomy.js",
      "data-embryology.js",
      "data-relation.js",
      "data-infectio.js",
      "heart-b64-1.js","heart-b64-2.js","heart-b64-3.js","data-real-heart.js",
      "resp-b64-1.js","resp-b64-2.js","resp-b64-3.js","data-real-resp.js",
      "emb-b64-1.js","emb-b64-2.js","data-real-emb.js",
      "drivepack-1.js","drivepack-2.js","drivepack-3.js","drivepack-4.js",
      "data-drive-20260917.js"
    ];
    const UPDATE_20261125=[
      "data-20261125-uea.js",
      "data-20261125-semiologie.js",
      "data-20261125-pharma-imagerie.js",
      "data-20261125-hygiene.js",
      "data-20261125-ethique-relation-anthro.js",
      "data-20261125-sciences-infirmieres.js",
      "data-20261125-bio-physio.js",
      "data-20261125-english.js",
      "data-20261125-raisonnement-relation-surveillance.js",
      "data-partiel-20261125.js"
    ];
    const frame=document.getElementById("appFrame");
    const loadScript=(doc,file)=>new Promise((resolve,reject)=>{
      const s=doc.createElement("script");
      s.src="./"+file+"?v=20261125-5";
      s.onload=resolve;
      s.onerror=()=>reject(new Error("Impossible de charger "+file));
      doc.body.appendChild(s);
    });
    frame.addEventListener("load",async()=>{
      const doc=frame.contentDocument;
      try{
        for(const file of BASE_MODULES) await loadScript(doc,file);
        if(frame.contentWindow.IDE2_DATA_READY) await frame.contentWindow.IDE2_DATA_READY;
        for(const file of UPDATE_20261125) await loadScript(doc,file);
        await loadScript(doc,"patch.js");
        await loadScript(doc,"patch-meta-20261125.js");
        await loadScript(doc,"curriculum-l1-20261124.js");
      }catch(err){
        console.error("IDE 2.0 — chargement de la mise à jour",err);
      }
    });
  </script>
</body>
</html>
