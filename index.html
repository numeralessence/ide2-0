<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a72">
  <title>IDE 2.0 — Révisions IFSI</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5f0}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f5f0}
  </style>
</head>
<body>
  <iframe id="appFrame" src="./Index.html" title="IDE 2.0 — Révisions IFSI"></iframe>
  <script>
    const IDE2_MODULES=[
      "data-anatomy.js",
      "data-embryology.js",
      "data-relation.js",
      "data-infectio.js",
      "data-real-heart.js",
      "data-real-resp.js",
      "data-real-emb.js",
      "patch.js"
    ];
    const frame=document.getElementById("appFrame");
    frame.addEventListener("load",async()=>{
      const doc=frame.contentDocument;
      try{
        for(const file of IDE2_MODULES){
          await new Promise((resolve,reject)=>{
            const s=doc.createElement("script");
            s.src="./"+file+"?v=20260908-4";
            s.onload=resolve;
            s.onerror=()=>reject(new Error("Impossible de charger "+file));
            doc.body.appendChild(s);
          });
        }
      }catch(err){
        console.error("IDE 2.0 — mise à jour Drive",err);
      }
    });
  </script>
</body>
</html>
